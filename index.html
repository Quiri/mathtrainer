<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mathe Trainer – Übe Bruchrechnen, negative Zahlen, Ausklammern und Gleichungen mit zufällig generierten Aufgaben in drei Schwierigkeitsstufen." />
  <title>Mathe Trainer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>Mathe Trainer</h1>
<p class="subtitle">Übe die vier wichtigsten Themen – Aufgaben werden zufällig generiert</p>

<div class="tabs" id="tabs">
  <button class="tab active" data-topic="bruch">Bruchrechnen</button>
  <button class="tab" data-topic="negativ">Negative Zahlen</button>
  <button class="tab" data-topic="ausklammern">Ausklammern</button>
  <button class="tab" data-topic="gleichung">Gleichungen (x)</button>
</div>

<div class="card">
  <div class="difficulty-row">
    <span class="difficulty-label">Schwierigkeit:</span>
    <button class="diff-btn active-easy" data-diff="easy">Leicht</button>
    <button class="diff-btn" data-diff="medium">Mittel</button>
    <button class="diff-btn" data-diff="hard">Schwer</button>
  </div>

  <div class="question-label">Aufgabe</div>
  <div class="question" id="question">Wird geladen…</div>
  <div class="hint" id="hint"></div>

  <div class="input-row">
    <input type="text" id="answer" placeholder="Deine Antwort…" autocomplete="off" />
    <button class="btn btn-check" id="checkBtn">Prüfen</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <button class="btn-next" id="nextBtn">Nächste Aufgabe →</button>
</div>

<div class="score-bar">
  <div class="score-item">
    <span class="score-num green" id="scoreCorrect">0</span>
    <span class="score-lbl">Richtig</span>
  </div>
  <div class="score-item">
    <span class="score-num red" id="scoreWrong">0</span>
    <span class="score-lbl">Falsch</span>
  </div>
  <div class="score-item">
    <span class="score-num blue" id="scoreTotal">0</span>
    <span class="score-lbl">Gesamt</span>
  </div>
</div>

<div class="progress-dots" id="progressDots"></div>

<footer>Alle Aufgaben werden zufällig generiert · © 2026 Mathe Trainer</footer>

<script src="main.js" defer></script>
</body>
</html>
